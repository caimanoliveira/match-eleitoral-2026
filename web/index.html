<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colinha — sua cola para a urna</title>
<meta name="description" content="Vá votar sabendo. Compare o que você pensa com o que cada candidato votou e leve sua colinha para a urna em 4 de outubro.">
<!-- Prévia do link no WhatsApp: sem isto o convite chega como texto cinza. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Colinha">
<meta property="og:title" content="Descubra em quem votar em 2 minutos">
<meta property="og:description" content="Compare o que você pensa com o que cada candidato votou — presidente a deputado estadual — e leve os números prontos para a urna. Grátis, sem cadastro.">
<meta property="og:url" content="https://colinha.app.br/">
<meta property="og:image" content="https://colinha.app.br/previa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="marca" href="#/" title="Início">
    <svg class="marca-icone" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
      <rect x="6" y="14" width="52" height="36" rx="7" fill="none" stroke="currentColor" stroke-width="4"/>
      <rect x="12" y="21" width="20" height="22" rx="2" fill="currentColor"/>
      <g fill="currentColor">
        <rect x="37" y="21" width="5" height="5" rx="1"/><rect x="45" y="21" width="5" height="5" rx="1"/>
        <rect x="37" y="29" width="5" height="5" rx="1"/><rect x="45" y="29" width="5" height="5" rx="1"/>
      </g>
      <rect x="37" y="37" width="13" height="6" rx="2" fill="var(--acao)"/>
    </svg>
    <span><b>Colinha</b><i>.app.br</i></span>
  </a>
  <a class="link-metodo" href="metodologia.html">Metodologia</a>
</header>

<main id="app"></main>

<template id="tpl-landing">
  <section class="tela landing">
    <div class="hero-caixa">
      <div class="hero">
        <div class="hero-texto">
          <p class="rotulo">Eleições · 4 de outubro de 2026</p>
          <h1 class="display">Em quem você <em>vota</em>?</h1>
          <p class="lead">
            Compare o que você pensa com o voto real de cada candidato, do presidente
            ao deputado estadual, e leve os números prontos para a urna.
          </p>
          <div class="ctas">
            <a class="primario cta" href="#/comecar">Descobrir meus candidatos</a>
            <a class="cta-secundario" href="#/colinha">Montar minha colinha</a>
          </div>
          <p class="cta-nota">34 afirmações, uns 5 minutos (ou 10, em 2) · sem cadastro · nada sai do seu aparelho</p>
        </div>
        <div class="hero-mapa" id="hero-mapa" aria-hidden="true"></div>
      </div>
    </div>

    <ol class="como">
      <li><span class="n">01</span><strong>Responda</strong>
        <span>Afirmações sobre o que o Congresso votou de verdade: terras indígenas,
        anistia, armas, impostos, redes sociais.</span></li>
      <li><span class="n">02</span><strong>Compare</strong>
        <span>Um percentual por candidato, com o porquê tema a tema e link para
        cada votação. Nada é opinião nossa.</span></li>
      <li><span class="n">03</span><strong>Leve para a urna</strong>
        <span>Sua colinha vira uma imagem com os números. Na cabine, é só
        digitar e confirmar.</span></li>
    </ol>

    <section class="jogos">
      <h2>Três minutos, três jogos</h2>
      <p class="lead">Com o mesmo dado real: como cada bancada e cada deputado votou.</p>
      <div class="jogos-lista">
        <a class="jogo" href="adivinha.html"><span class="bloco"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="42" cy="42" r="26" fill="none" stroke="currentColor" stroke-width="9"/><path d="M62 62 L88 88" stroke="currentColor" stroke-width="11" stroke-linecap="round"/></svg></span><span class="txt"><b>Adivinha como votou</b><span>Uma votação, um partido ou deputado: você chuta. 10 rodadas.</span></span></a>
        <a class="jogo" href="qual-partido.html"><span class="bloco"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 20 h72 a8 8 0 0 1 8 8 v36 a8 8 0 0 1 -8 8 h-38 l-18 16 v-16 h-16 a8 8 0 0 1 -8 -8 v-36 a8 8 0 0 1 8 -8z" fill="currentColor"/><rect x="26" y="34" width="34" height="7" rx="3.5" fill="#fff"/><rect x="26" y="49" width="48" height="7" rx="3.5" fill="#fff"/></svg></span><span class="txt"><b>Qual partido vota como você?</b><span>8 afirmações e o ranking das bancadas.</span></span></a>
        <a class="jogo" href="bancada.html"><span class="bloco"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="10" y="58" width="14" height="30" rx="3"/><rect x="29" y="40" width="14" height="48" rx="3"/><rect x="48" y="24" width="14" height="64" rx="3"/><rect x="67" y="46" width="14" height="42" rx="3"/></g><path d="M6 92 h88" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span><span class="txt"><b>Monte sua bancada</b><span>Escolha 5 pautas e veja se passariam na Câmara de hoje.</span></span></a>
      </div>
    </section>

    <section class="faixa">
      <div class="faixa-in">
        <div><b id="fato-candidatos">—</b><span>candidatos comparados, todos os cargos e estados</span></div>
        <div><b id="fato-teses">—</b><span>afirmações, cada uma ancorada em uma votação real</span></div>
        <div><b>0</b><span>dados seus enviados a qualquer lugar</span></div>
      </div>
    </section>

    <section class="honesto">
      <div>
        <h2>De onde vem a posição de cada candidato</h2>
        <p>Do voto dele no Congresso, quando é deputado ou senador. Quando não é, de
        como a bancada do partido votou, e o site diz qual dos dois é o caso, sempre.
        Cada posição tem link para a fonte.</p>
        <p>Isto compara posições. <b>Não é recomendação de voto.</b> Não tem vínculo
        com partido, candidatura ou governo, e <b>nenhuma relação com o TSE</b> ou a
        Justiça Eleitoral: usamos só os dados públicos que eles publicam.
        <a href="metodologia.html">Metodologia completa.</a></p>
      </div>
      <div>
        <h2>Vá votar</h2>
        <ul>
          <li><b>Título em dia?</b> Confira situação e local de votação no
            <a href="https://www.tse.jus.br/servicos-eleitorais/titulo-e-local-de-votacao" target="_blank" rel="noopener">site do TSE</a>.</li>
          <li><b>Fora do domicílio?</b> Justifique pelo e-Título no dia, ou em até 60 dias.</li>
          <li><b>Leve a colinha no papel.</b> Anotação é permitida na cabine; celular
            muitas vezes não. Anote os números antes de entrar.</li>
        </ul>
      </div>
    </section>
  </section>
</template>

<template id="tpl-inicio">
  <section class="tela inicio">
    <h1>Em que estado você vota?</h1>
    <p class="lead">
      Governador, senador e deputados mudam de estado para estado. Com isso a gente
      carrega só os candidatos que vão aparecer na sua urna.
    </p>

    <label class="campo">
      <span>Seu estado</span>
      <select id="uf" aria-describedby="erro-uf"></select>
      <span class="erro-campo" id="erro-uf" role="alert"></span>
    </label>

    <button class="primario" id="comecar">Começar</button>
    <button class="secundario" id="comecar-rapido" hidden>Prefiro o quiz rápido: 10 afirmações, 2 minutos</button>

    <p class="aviso">
      Suas respostas não saem deste aparelho: o cálculo roda no seu navegador e nada
      é enviado para lugar nenhum. Isto compara posições — não é recomendação de voto.
    </p>
  </section>
</template>

<template id="tpl-quiz">
  <section class="tela quiz">
    <div class="progresso"><div class="barra"></div></div>
    <p class="contador"></p>

    <h2 class="tese"></h2>
    <details class="contexto">
      <summary>Entenda a disputa</summary>
      <p></p>
    </details>

    <label class="importante">
      <input type="checkbox"> Este tema é <b>muito importante</b> para mim
      <small>conta em dobro</small>
    </label>

    <div class="respostas">
      <button data-valor="1"  class="resp concordo">Concordo</button>
      <button data-valor="0"  class="resp neutro">Tanto faz</button>
      <button data-valor="-1" class="resp discordo">Discordo</button>
    </div>

    <div class="navegacao">
      <button class="secundario" id="voltar">Voltar</button>
      <button class="secundario" id="pular">Pular esta</button>
    </div>

    <button class="ver-parcial" id="ver-parcial" hidden></button>

    <p class="dica-teclado" aria-hidden="true">
      No teclado: <kbd>1</kbd> concordo · <kbd>2</kbd> tanto faz · <kbd>3</kbd> discordo
      · <kbd>←</kbd> voltar
    </p>
  </section>
</template>

<template id="tpl-resultado">
  <section class="tela resultado">
    <h1>Seus candidatos</h1>
    <p class="nota-parcial" id="nota-parcial" hidden></p>
    <button class="secundario continuar" id="continuar" hidden></button>
    <p class="falha-carga" id="falha-carga" hidden></p>
    <div id="bussola"></div>
    <div class="abas-caixa"><nav class="abas" id="abas"></nav></div>

    <div class="busca-linha">
      <label class="busca">
        <span class="sr">Buscar candidato</span>
        <input type="search" id="busca" placeholder="Buscar candidato por nome ou número"
               autocomplete="off" spellcheck="false">
      </label>
      <button class="filtro" id="so-favoritos" aria-pressed="false">★ Favoritos</button>
    </div>

    <div id="avisos-lista"></div>
    <ol class="lista" id="lista"></ol>
    <button class="secundario mais" id="mais" hidden>Mostrar mais 30</button>
    <p class="aviso" id="rodape-fonte"></p>
    <button class="primario" id="ver-colinha">Ver minha colinha</button>
    <button class="primario" id="completar" hidden></button>
    <div class="mandar">
      <button class="secundario" id="mandar-quiz">Mandar o quiz para amigos</button>
      <button class="secundario" id="mandar-resultado">Mandar meu resultado</button>
    </div>
  </section>
</template>

<template id="tpl-chegada">
  <section class="tela chegada">
    <p class="eyebrow">Alguém te mandou isto</p>
    <h1>Esse resultado é de quem te mandou. O seu é diferente.</h1>
    <p class="lead" id="chegada-topo"></p>
    <p class="lead">Responda e veja os seus candidatos — presidente, governador, senado e
      deputados. Sem cadastro.</p>
    <div class="navegacao">
      <button class="primario" id="chegada-meu">Fazer o meu</button>
      <button class="secundario" id="chegada-ver">Ver o resultado que me mandaram</button>
    </div>
  </section>
</template>

<template id="tpl-colinha">
  <section class="tela colinha">
    <h1>Sua colinha</h1>
    <p class="lead">Leve para a urna. O que você digita é o <b>número</b>.</p>
    <p class="falha-carga" id="colinha-perdidos" hidden></p>
    <div id="cartao"></div>
    <div class="navegacao">
      <button class="primario" id="compartilhar">Compartilhar</button>
      <button class="secundario" id="voltar-resultado">Voltar</button>
    </div>
    <p class="aviso">
      Confira sempre o número no site oficial do TSE antes de votar. A Colinha é um
      projeto independente, sem qualquer relação com o TSE ou a Justiça Eleitoral.
    </p>
  </section>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
