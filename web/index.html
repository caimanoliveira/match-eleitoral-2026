<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colinha — sua cola para a urna</title>
<meta name="description" content="Vá votar sabendo. Compare o que você pensa com o que cada candidato votou e leve sua colinha para a urna em 4 de outubro.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="marca" href="#/" title="Início">
    <svg class="marca-icone" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
      <rect x="6" y="14" width="52" height="36" rx="7" fill="none" stroke="currentColor" stroke-width="4"/>
      <rect x="12" y="21" width="20" height="22" rx="2" fill="currentColor"/>
      <g fill="currentColor">
        <rect x="37" y="21" width="5" height="5" rx="1"/><rect x="45" y="21" width="5" height="5" rx="1"/>
        <rect x="37" y="29" width="5" height="5" rx="1"/><rect x="45" y="29" width="5" height="5" rx="1"/>
      </g>
      <rect x="37" y="37" width="13" height="6" rx="2" fill="var(--acao)"/>
    </svg>
    <span><b>Colinha</b><i>.vote</i></span>
  </a>
  <a class="link-metodo" href="metodologia.html">Metodologia</a>
</header>

<main id="app"></main>

<template id="tpl-landing">
  <section class="tela landing">
    <div class="hero">
      <div class="hero-texto">
        <p class="eyebrow">4 de outubro · dia de votar</p>
        <h1 class="display">Vá votar. E vá <em>sabendo</em> em quem.</h1>
        <p class="lead">
          Você escolhe cinco pessoas na urna. Presidente e governador, talvez você
          conheça. Deputado federal e estadual — onde a maior parte das leis é
          decidida — quase todo mundo escolhe no escuro. A Colinha compara o que
          você pensa com o que <b>cada candidato votou</b>, e entrega os números
          prontos para digitar.
        </p>
      </div>
      <div class="urna" aria-hidden="true">
        <div class="ue">
          <div class="ue-corpo">
            <div class="ue-tela">
              <span class="ue-tela-rot">SEU VOTO PARA</span>
              <span class="ue-tela-cargo">Deputado Federal</span>
              <span class="ue-tela-num"><i>1</i><i>3</i><i>1</i><i>3</i></span>
            </div>
            <div class="ue-teclado">
              <span>1</span><span>2</span><span>3</span>
              <span>4</span><span>5</span><span>6</span>
              <span>7</span><span>8</span><span>9</span>
              <span class="vazio"></span><span>0</span><span class="vazio"></span>
              <span class="branco">BRANCO</span>
              <span class="corrige">CORRIGE</span>
              <span class="confirma">CONFIRMA</span>
            </div>
          </div>
          <div class="ue-lado"></div>
        </div>
        <div class="urna-sombra"></div>
      </div>
    </div>

    <a class="primario cta" href="#/comecar">Montar minha colinha</a>
    <p class="cta-nota">Uns 5 minutos. Sem cadastro, sem coletar suas respostas.</p>

    <ol class="como">
      <li>
        <b>Responda a afirmações sobre o que está em disputa</b>
        <span>Terras indígenas, anistia, armas, impostos, redes sociais. Frases
        diretas: concordo, tanto faz, discordo.</span>
      </li>
      <li>
        <b>Veja quem votou como você pensa</b>
        <span>Para cada cargo, do presidente ao deputado estadual, um percentual de
        afinidade — e o porquê, tema a tema, com link para a votação.</span>
      </li>
      <li>
        <b>Leve os números para a urna</b>
        <span>Sua colinha vira uma imagem no celular. Na cabine, é só digitar e
        apertar CONFIRMA.</span>
      </li>
    </ol>

    <dl class="fatos">
      <div><dt id="fato-candidatos">—</dt><dd>candidatos comparados, todos os cargos e estados</dd></div>
      <div><dt id="fato-teses">—</dt><dd>afirmações, cada uma ancorada em uma votação real</dd></div>
      <div><dt>0</dt><dd>dados seus enviados a qualquer lugar</dd></div>
    </dl>

    <section class="civico">
      <h2>Votar é o que você tem de mais forte</h2>
      <p>
        Deputado é eleito com poucos milhares de votos. O seu, junto com o de quem
        você convence, decide quem escreve as leis pelos próximos quatro anos. Não
        vale votar no escuro — e não vale ficar em casa.
      </p>
      <ul class="civico-lista">
        <li><b>Título em dia?</b> Confira sua situação e o local de votação no
          <a href="https://www.tse.jus.br/servicos-eleitorais/titulo-e-local-de-votacao" target="_blank" rel="noopener">site do TSE</a>.</li>
        <li><b>Vai estar fora do domicílio?</b> Justifique pelo app e-Título no dia,
          ou em até 60 dias.</li>
        <li><b>Leve a colinha, de preferência no papel.</b> Anotação é permitida
          na cabine. Celular muitas vezes não: o mesário pode pedir para deixá-lo
          fora. Anote os números antes de entrar.</li>
      </ul>
    </section>

    <section class="honesto">
      <h2>De onde vem a posição de cada candidato</h2>
      <p>
        Do voto dele no Congresso, quando é deputado ou senador. Quando não é, da
        forma como a bancada do partido dele votou — e o site diz qual dos dois é o
        caso, sempre. Não há opinião nossa em lugar nenhum: é registro público,
        e cada um tem link para a fonte.
      </p>
      <p>
        Isto compara posições. <b>Não é recomendação de voto</b>, e não tem vínculo
        com partido, candidatura ou governo. <a href="metodologia.html">Como funciona, em detalhe.</a>
      </p>
    </section>
  </section>
</template>

<template id="tpl-inicio">
  <section class="tela inicio">
    <h1>Em que estado você vota?</h1>
    <p class="lead">
      Governador, senador e deputados mudam de estado para estado. Com isso a gente
      carrega só os candidatos que vão aparecer na sua urna.
    </p>

    <label class="campo">
      <span>Seu estado</span>
      <select id="uf" aria-describedby="erro-uf"></select>
      <span class="erro-campo" id="erro-uf" role="alert"></span>
    </label>

    <button class="primario" id="comecar">Começar</button>

    <p class="aviso">
      Suas respostas não saem deste aparelho: o cálculo roda no seu navegador e nada
      é enviado para lugar nenhum. Isto compara posições — não é recomendação de voto.
    </p>
  </section>
</template>

<template id="tpl-quiz">
  <section class="tela quiz">
    <div class="progresso"><div class="barra"></div></div>
    <p class="contador"></p>

    <h2 class="tese"></h2>
    <details class="contexto">
      <summary>Entenda a disputa</summary>
      <p></p>
    </details>

    <label class="importante">
      <input type="checkbox"> Este tema é <b>muito importante</b> para mim
      <small>conta em dobro</small>
    </label>

    <div class="respostas">
      <button data-valor="1"  class="resp concordo">Concordo</button>
      <button data-valor="0"  class="resp neutro">Tanto faz</button>
      <button data-valor="-1" class="resp discordo">Discordo</button>
    </div>

    <div class="navegacao">
      <button class="secundario" id="voltar">Voltar</button>
      <button class="secundario" id="pular">Pular esta</button>
    </div>

    <button class="ver-parcial" id="ver-parcial" hidden></button>

    <p class="dica-teclado" aria-hidden="true">
      No teclado: <kbd>1</kbd> concordo · <kbd>2</kbd> tanto faz · <kbd>3</kbd> discordo
      · <kbd>←</kbd> voltar
    </p>
  </section>
</template>

<template id="tpl-resultado">
  <section class="tela resultado">
    <h1>Seus candidatos</h1>
    <p class="nota-parcial" id="nota-parcial" hidden></p>
    <button class="secundario continuar" id="continuar" hidden></button>
    <p class="falha-carga" id="falha-carga" hidden></p>
    <div id="bussola"></div>
    <div class="abas-caixa"><nav class="abas" id="abas"></nav></div>

    <label class="busca">
      <span class="sr">Buscar candidato</span>
      <input type="search" id="busca" placeholder="Buscar candidato por nome ou número"
             autocomplete="off" spellcheck="false">
    </label>

    <div id="avisos-lista"></div>
    <ol class="lista" id="lista"></ol>
    <button class="secundario mais" id="mais" hidden>Mostrar mais 30</button>
    <p class="aviso" id="rodape-fonte"></p>
    <button class="primario" id="ver-colinha">Ver minha colinha</button>
  </section>
</template>

<template id="tpl-colinha">
  <section class="tela colinha">
    <h1>Sua colinha</h1>
    <p class="lead">Leve para a urna. O que você digita é o <b>número</b>.</p>
    <p class="falha-carga" id="colinha-perdidos" hidden></p>
    <div id="cartao"></div>
    <div class="navegacao">
      <button class="primario" id="compartilhar">Compartilhar</button>
      <button class="secundario" id="voltar-resultado">Voltar</button>
    </div>
    <p class="aviso">
      Confira sempre o número no site oficial do TSE antes de votar.
    </p>
  </section>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
