name: sonda-fotos
on: { workflow_dispatch: {} }
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "pipeline")
          from fetch import get_json   # descomprime gzip e usa os headers que o WAF aceita
          for ds in ["candidatos-2026", "fotos-de-candidatos-2026", "candidatos-2022"]:
              try:
                  d = get_json(f"https://dadosabertos.tse.jus.br/api/3/action/package_show?id={ds}", f"ckan-{ds}.json", max_age=0)["result"]
                  print(f"## {ds}: {len(d['resources'])} recursos")
                  for res in d["resources"]:
                      if "foto" in (res.get("name","") + res.get("url","")).lower():
                          print(f"   {str(res.get('size') or '?'):>12}  {res['url']}")
              except Exception as e:
                  print(f"## {ds}: {type(e).__name__} {str(e)[:80]}")
          try:
              r = get_json("https://dadosabertos.tse.jus.br/api/3/action/package_search?q=foto&rows=20", "ckan-busca.json", max_age=0)["result"]
              print(f"## busca 'foto': {r['count']} datasets")
              for p in r["results"]:
                  print(f"   {p['name']}")
          except Exception as e:
              print(f"## busca: {type(e).__name__} {str(e)[:80]}")
          PY
