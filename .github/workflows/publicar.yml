# Publica web/ no GitHub Pages.
#
# O Pages serve a raiz do repositório ou /docs, não /web — e publicar a raiz
# exporia pipeline/ e a semente. Este workflow sobe só web/ como artefato.
#
# Dispara a cada push no main, inclusive nos commits do rebuild diário: o site
# no ar acompanha os dados sem ninguém precisar lembrar de publicar.

name: publicar

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sem isto, um push de CSS publicaria o site sem fotos: elas não estão
      # no repositório. Reaproveita os zips cacheados pelo rebuild.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/consulta_cand_2026.zip
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-
      - name: fotos
        run: python3 -c "import sys; sys.path.insert(0,'pipeline'); import fotos; fotos.baixar()"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
