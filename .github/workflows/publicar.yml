# Publica web/ no GitHub Pages.
#
# O Pages serve a raiz do repositório ou /docs, não /web — e publicar a raiz
# exporia pipeline/ e a semente. Este workflow sobe só web/ como artefato.
#
# Dispara a cada push no main, inclusive nos commits do rebuild diário: o site
# no ar acompanha os dados sem ninguém precisar lembrar de publicar.

name: publicar

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
