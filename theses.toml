# Teses do quiz. Este é o coração editorial do projeto — o resto é encanamento.
#
# Campos de cada tese:
#   id        slug estável (entra na URL do resultado; nunca renomear depois do lançamento)
#   texto     a afirmação que o eleitor concorda/discorda. Primeira pessoa do plural,
#             afirmativa, uma ideia só. Nada de "não deveria" (dupla negação confunde).
#   contexto  1-2 frases neutras explicando a disputa, mostradas no "entenda"
#   esfera    "federal" | "estadual" | "ambas" — define quem responde a tese
#   eixo      posição no mapa 2D quando o eleitor CONCORDA. -1..+1
#               economico: -1 estatista/redistributivo .. +1 mercado
#               social:    -1 progressista              .. +1 conservador
#             Peso 0.0 é legítimo: nem toda disputa é esquerda-direita (ver blindagem).
#   votacoes  votações da Câmara que operacionalizam a tese.
#               direcao = +1  votar "Sim" equivale a CONCORDAR com a tese
#               direcao = -1  votar "Sim" equivale a DISCORDAR
#   votacoes_senado
#             O mesmo, para o Senado (id = codigoSessaoVotacao). Só entra depois de
#             ler o texto votado: o Senado renumera e vota substitutivo inteiro, então
#             "mesma matéria" NÃO significa "mesma pergunta". Das 34 teses, 7 tinham
#             rastro no Senado e só 4 mediam a mesma coisa — uma delas com o sinal
#             invertido em relação à Câmara. Dá voto próprio aos 47 senadores que
#             são candidatos em 2026, 9 deles a governador.
#
#   verificado / verificado_em / verificado_por
#             O build DESCARTA tese não verificada. A direção não pode ser inferida do
#             texto do rito: "Mantido o texto" só informa que um destaque caiu, não o que
#             o texto dizia. Inverter uma tese entrega ao eleitor o candidato oposto ao
#             que ele quis — é o pior defeito possível aqui. Só marque verificado depois
#             de abrir a votação no portal da Câmara e confirmar o que "Sim" significou.
#             Rode `python3 pipeline/verificar.py <id>` para o dossiê da votação.

